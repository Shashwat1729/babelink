[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lorebridge"
version = "0.1.0"
description = "Context-aware translation for web novels, EPUBs and manhua: one memory of names, tone and plot across every chapter"
readme = "README.md"
keywords = ["translation", "web-novel", "epub", "manhua", "manga", "ocr", "llm", "ollama", "glossary"]
requires-python = ">=3.11"
dependencies = [
  "ebooklib>=0.18",
  "langdetect>=1.0.9",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
images = ["rapidocr-onnxruntime>=1.3", "opencv-python-headless>=4.8", "numpy>=1.24", "Pillow>=10"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
lorebridge = "lorebridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lorebridge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
