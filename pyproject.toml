[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storytranslate"
version = "0.1.0"
description = "Context-aware, consistent, multilingual long-form story translation"
requires-python = ">=3.11"
dependencies = [
  "ebooklib>=0.18",
  "langdetect>=1.0.9",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.scripts]
storytranslate = "storytranslate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
